name: secret-scan

# This gate BLOCKS merge. isma-core is public, and until now nothing stopped a
# secret from being merged into it.
#
# Two jobs, two different questions, deliberately separated:
#   gitleaks       — does THIS change introduce a secret? Scans the PR's commit
#                    range and BLOCKS merge on a finding.
#   history-audit  — is anything sitting in the past? Scans every ref weekly and
#                    REPORTS. It cannot block, because a finding already in
#                    history is unfixable without a rewrite, and a permanently
#                    red required check gets ignored — which is worse than none.
#
# Never scan only the tip. Measured on this repo 2026-07-30: a HEAD-only scan
# covered 40 of 45 commits and missed every commit on the open PR branches that
# were about to merge. Scanning a range beats scanning a point.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full-history audit — reports, never blocks a merge.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (blocks merge)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          # depth 0 is load-bearing: a shallow clone silently scans a fraction
          # of the history and still reports success.
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the commits this change introduces
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Scope: what THIS change introduces, not the whole past.
          #
          # A merge gate that scans all history blocks every PR on a finding
          # nobody can fix without rewriting history — and a permanently red
          # gate gets ignored, which is worse than no gate. Pre-existing
          # history is audited separately by the `history-audit` job below,
          # which reports without blocking.
          if [ -n "${BASE_SHA:-}" ]; then
            RANGE="${BASE_SHA}..HEAD"
          elif [ -n "${BEFORE_SHA:-}" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE_SHA}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "scanning range: ${RANGE}"
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --log-opts="${RANGE}" \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  training-data:
    name: no training data or PII-shaped files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject training corpora and PII-shaped files
        run: |
          set -euo pipefail
          # gitleaks covers secrets. These are the mandate's other two
          # categories, which a secret scanner does not look for at all.
          violations=0

          # Training data: .jsonl corpora and SFT/CPT artifacts do not belong
          # in a retrieval product repo.
          if git ls-files -z '*.jsonl' | grep -qz . 2>/dev/null; then
            echo "::error::training-data: .jsonl files are not permitted in this repo"
            git ls-files '*.jsonl' | sed 's/^/  /'
            violations=1
          fi

          # Model weights / checkpoints.
          if git ls-files -z '*.safetensors' '*.ckpt' '*.pt' '*.bin' | grep -qz . 2>/dev/null; then
            echo "::error::model weights or checkpoints committed"
            git ls-files '*.safetensors' '*.ckpt' '*.pt' '*.bin' | sed 's/^/  /'
            violations=1
          fi

          # Environment files that should never be committed (the .example
          # template is the supported way to document configuration).
          if git ls-files | grep -E '(^|/)\.env$' >/dev/null 2>&1; then
            echo "::error::.env is committed; commit .env.example instead"
            violations=1
          fi

          if [ "$violations" -ne 0 ]; then
            echo "Gate failed. See errors above."
            exit 1
          fi
          echo "OK: no training data, weights, or committed .env"

  history-audit:
    name: full-history audit (reports, does not block)
    runs-on: ubuntu-latest
    # Known pre-existing finding as of 2026-07-30: a private RFC1918 address in
    # two early commits (initial baseline, and the de-umbilical commit that
    # REMOVED it). Not present in the current tree and not on public main.
    # Clearing it requires a history rewrite, which is an explicit human
    # decision — so this job surfaces the state instead of silently blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Audit every ref
        run: |
          set -euo pipefail
          gitleaks detect --source . --config .gitleaks.toml --redact \
            --log-opts=--all --report-format json --report-path history.json \
            --exit-code 0
          echo "findings: $(python3 -c 'import json;print(len(json.load(open("history.json"))))')"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-history-audit
          path: history.json
          if-no-files-found: ignore
